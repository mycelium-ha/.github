name: Reusable HA Beta Tests

# Early warning for upcoming Home Assistant releases: runs the test suite against
# the newest pytest-homeassistant-custom-component pre-release, which pins the
# matching Home Assistant (pre-)release. Call it from a scheduled workflow.

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version"
        required: false
        default: "3.14"
        type: string
      requirements_file:
        description: "Requirements file with the test dependencies"
        required: false
        default: "requirements_test.txt"
        type: string
      pytest_args:
        description: "Extra arguments for pytest, e.g. -k 'not snapshot' to skip version-pinned snapshots"
        required: false
        default: ""
        type: string
      run_ha_compat:
        description: "Also check the newest Home Assistant pre-release without pytest: scripts/check_ha_compat.py if present, and mypy if run_mypy"
        required: false
        default: false
        type: boolean
      run_mypy:
        description: "Run mypy in the compatibility job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pytest-beta:
    name: Run pytest on Home Assistant beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      # Upgrade the test harness, not Home Assistant alone: a newer Home Assistant
      # under an older harness fails at import.
      - name: Install test dependencies with the newest Home Assistant pre-release
        env:
          REQUIREMENTS: ${{ inputs.requirements_file }}
        run: |
          python -m pip install --upgrade pip
          pip install -r "$REQUIREMENTS"
          pip install --upgrade --pre pytest-homeassistant-custom-component
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run pytest
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        # eval keeps shell quoting in pytest_args (e.g. -k "not snapshot"); the value
        # comes from the calling workflow file, never from user-controlled events.
        run: eval "pytest $PYTEST_ARGS"

  compat-beta:
    if: ${{ inputs.run_ha_compat }}
    name: Compatibility with Home Assistant beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      # The harness often lags behind a Home Assistant pre-release, so this job checks
      # the pre-release itself without pytest: importing every module shows the
      # deprecation warnings Home Assistant logs, mypy shows typing changes.
      - name: Install the newest Home Assistant pre-release and mypy
        env:
          REQUIREMENTS: ${{ inputs.requirements_file }}
        run: |
          python -m pip install --upgrade pip
          pip install --pre homeassistant $(grep -E '^mypy==' "$REQUIREMENTS" || echo mypy)
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Import every module and fail on deprecated Home Assistant APIs
        run: |
          if [ -f scripts/check_ha_compat.py ]; then
            python scripts/check_ha_compat.py
          else
            echo "::notice::scripts/check_ha_compat.py not found, skipping the import check"
          fi
      - name: Type-check with mypy
        if: ${{ inputs.run_mypy }}
        run: mypy
