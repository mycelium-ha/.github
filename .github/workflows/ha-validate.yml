name: Reusable HA Validation

# Shared validation for every mycelium-ha repository.
# Always: hassfest (integrations), Marketplace/HACS validation, ruff.
# Opt-in: translation parity, mypy, pytest (with coverage and a per-module coverage
# check), pytest on the minimum supported Home Assistant version, and a compatibility
# check against the newest stable Home Assistant.

on:
  workflow_call:
    inputs:
      hacs_category:
        description: "Marketplace/HACS repository category (integration, plugin, template, theme)"
        required: false
        default: "integration"
        type: string
      hacs_ignore:
        description: "Space-separated list of HACS checks to ignore (optional)"
        required: false
        default: ""
        type: string
      run_hassfest:
        description: "Run hassfest validation (only for integrations)"
        required: false
        default: true
        type: boolean
      run_ruff:
        description: "Run ruff lint and format checks"
        required: false
        default: true
        type: boolean
      run_translations:
        description: "Run scripts/check_translations.py if the repository has it"
        required: false
        default: true
        type: boolean
      run_mypy:
        description: "Run mypy (configured in pyproject.toml) with the test requirements installed"
        required: false
        default: false
        type: boolean
      run_pytest:
        description: "Run pytest with the test requirements installed"
        required: false
        default: false
        type: boolean
      pytest_args:
        description: "Extra arguments for pytest, e.g. --cov"
        required: false
        default: ""
        type: string
      python_version:
        description: "Python version for mypy and pytest"
        required: false
        default: "3.14"
        type: string
      requirements_file:
        description: "Requirements file with the test and tooling dependencies"
        required: false
        default: "requirements_test.txt"
        type: string
      min_ha_requirements_file:
        description: "Requirements file pinning the minimum supported Home Assistant; empty skips that job"
        required: false
        default: ""
        type: string
      min_ha_pytest_args:
        description: "Extra pytest arguments on the minimum Home Assistant, e.g. -k 'not snapshot' for version-pinned snapshots"
        required: false
        default: ""
        type: string
      run_coverage_check:
        description: "After pytest, run scripts/check_coverage.py coverage.json (pytest_args must write --cov-report=json)"
        required: false
        default: false
        type: boolean
      run_ha_latest:
        description: "Check against the newest stable Home Assistant without pytest: scripts/check_ha_compat.py if present, and mypy if run_mypy"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  hassfest:
    if: ${{ inputs.run_hassfest }}
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    name: Validate for HA Marketplace (HACS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: ${{ inputs.hacs_category }}
          ignore: ${{ inputs.hacs_ignore }}

  ruff:
    if: ${{ inputs.run_ruff }}
    name: Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Uses the ruff version pinned in the requirements file (falls back to latest).
      # ruff-action publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check"
          version-file: ${{ inputs.requirements_file }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"
          version-file: ${{ inputs.requirements_file }}

  translations:
    if: ${{ inputs.run_translations }}
    name: Translation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Check strings.json against translations/
        run: |
          if [ -f scripts/check_translations.py ]; then
            python scripts/check_translations.py
          else
            echo "::notice::scripts/check_translations.py not found, skipping translation parity check"
          fi

  python:
    if: ${{ inputs.run_mypy || inputs.run_pytest }}
    name: Type check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements_file }}
      - name: Install test dependencies
        env:
          REQUIREMENTS: ${{ inputs.requirements_file }}
        run: |
          python -m pip install --upgrade pip
          pip install -r "$REQUIREMENTS"
      - name: Type-check with mypy
        if: ${{ inputs.run_mypy }}
        run: mypy
      - name: Run pytest
        if: ${{ inputs.run_pytest }}
        env:
          PYTEST_ARGS: ${{ inputs.pytest_args }}
        # eval keeps shell quoting in pytest_args (e.g. -k "not slow"); the value
        # comes from the calling workflow file, never from user-controlled events.
        run: eval "pytest $PYTEST_ARGS"
      - name: Check the coverage of every module
        if: ${{ inputs.run_pytest && inputs.run_coverage_check }}
        run: python scripts/check_coverage.py coverage.json

  python-min-ha:
    if: ${{ inputs.run_pytest && inputs.min_ha_requirements_file != '' }}
    name: Tests on minimum Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install test dependencies (minimum HA)
        env:
          REQUIREMENTS: ${{ inputs.min_ha_requirements_file }}
        run: |
          python -m pip install --upgrade pip
          pip install -r "$REQUIREMENTS"
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Run pytest
        env:
          PYTEST_ARGS: ${{ inputs.min_ha_pytest_args }}
        # See "Run pytest" above for why eval is safe here.
        run: eval "pytest $PYTEST_ARGS"

  ha-latest:
    if: ${{ inputs.run_ha_latest }}
    name: Compatibility with the newest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version }}
      # No pytest: pytest-homeassistant-custom-component pins one Home Assistant
      # release and breaks when a newer one is installed over it. Importing every
      # module shows the deprecation warnings Home Assistant logs; mypy shows typing
      # changes. mypy keeps the version pinned in the requirements file.
      - name: Install the newest stable Home Assistant and mypy
        env:
          REQUIREMENTS: ${{ inputs.requirements_file }}
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant $(grep -E '^mypy==' "$REQUIREMENTS" || echo mypy)
          python -c "from homeassistant.const import __version__; print('Home Assistant', __version__)"
      - name: Import every module and fail on deprecated Home Assistant APIs
        run: |
          if [ -f scripts/check_ha_compat.py ]; then
            python scripts/check_ha_compat.py
          else
            echo "::notice::scripts/check_ha_compat.py not found, skipping the import check"
          fi
      - name: Type-check with mypy
        if: ${{ inputs.run_mypy }}
        run: mypy
