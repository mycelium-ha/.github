name: Reusable HA Release

# Creates a GitHub release for a pushed version tag (e.g. v1.2.3) after checking
# that the tag matches the `version` in manifest.json. The Marketplace/HACS picks
# up new releases automatically.
#
# The calling workflow must run on tag pushes and grant `contents: write`.

on:
  workflow_call:
    inputs:
      manifest_path:
        description: "Path to manifest.json; empty finds custom_components/*/manifest.json"
        required: false
        default: ""
        type: string
      prerelease_pattern:
        description: "Regex; tags matching it are published as pre-releases"
        required: false
        default: "(a|b|rc|beta|alpha)[0-9]*$"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify version and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag against manifest.json version
        id: version
        env:
          MANIFEST: ${{ inputs.manifest_path }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$MANIFEST" ]; then
            set -- custom_components/*/manifest.json
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "::error::Expected exactly one custom_components/*/manifest.json, set manifest_path"
              exit 1
            fi
            MANIFEST="$1"
          fi
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$MANIFEST")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error file=$MANIFEST::Tag $TAG does not match manifest.json version $VERSION"
            exit 1
          fi
          echo "Releasing $TAG (manifest.json version $VERSION)"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE_PATTERN: ${{ inputs.prerelease_pattern }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi
          FLAGS=(--verify-tag --generate-notes --title "$TAG")
          if [[ "$TAG" =~ $PRERELEASE_PATTERN ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" "${FLAGS[@]}"
