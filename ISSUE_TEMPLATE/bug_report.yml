name: Bug Report
description: Report a problem with this integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.

        **Do not post passwords, tokens, device IDs, serial numbers or IP addresses.** The diagnostics download redacts them and is safe to attach.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2026.11.2"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      description: Settings > Marketplace, or `version` in the integration's `manifest.json`.
      placeholder: "e.g. 1.2.0"
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Installation Method
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Configure '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings > Devices & services > the integration > ⋮ > **Download diagnostics**. Drag the file here.
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: |
        Settings > Devices & services > the integration > ⋮ > **Enable debug logging**, reproduce the problem, then disable debug logging to download the log. Paste the relevant lines here.
      render: text
