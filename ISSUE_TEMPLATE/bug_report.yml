name: Bug Report
description: Report a problem with this integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2026.11.2"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration Version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install_type
    attributes:
      label: Installation Method
      options:
        - Home Assistant OS
        - Home Assistant Container
        - Home Assistant Supervised
        - Home Assistant Core
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Configure '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug Logs
      description: Enable debug logging for this integration in Home Assistant and paste the relevant log lines here.
      render: text
